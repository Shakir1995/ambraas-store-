<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambraas Professional — Executive Admin Suite</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; }
    body { background:#0a0a0a; color:#e0e0e0; min-height:100vh; display:flex; flex-direction:column; }
    
    /* Header */
    header { background:#111; border-bottom:1px solid #c5a059; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-family:'Cinzel',serif; font-size:1.4rem; color:#d4af37; letter-spacing:2px; font-weight:700; }
    .status-badge { background:rgba(212,175,55,0.1); border:1px solid #d4af37; color:#d4af37; font-size:0.75rem; padding:6px 12px; border-radius:20px; }

    /* Layout */
    .admin-container { display:flex; flex:1; }
    .sidebar { width:240px; background:#0d0d0d; border-right:1px solid #222; padding:20px 10px; display:flex; flex-direction:column; gap:8px; }
    .nav-btn { background:transparent; border:none; color:#888; padding:12px 18px; text-align:left; font-size:0.9rem; font-weight:500; border-radius:8px; cursor:pointer; transition:0.3s; }
    .nav-btn:hover, .nav-btn.active { background:rgba(212,175,55,0.15); color:#d4af37; border-left:3px solid #d4af37; }

    .main-content { flex:1; padding:30px; overflow-y:auto; }
    .tab-content { display:none; }
    .tab-content.active { display:block; animation:fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

    /* Cards */
    .grid-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin-bottom:30px; }
    .stat-card { background:#141414; border:1px solid #222; border-radius:12px; padding:20px; border-top:2px solid #d4af37; }
    .stat-title { font-size:0.8rem; color:#888; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .stat-val { font-size:1.8rem; font-weight:600; color:#fff; }
    .stat-val span { color:#d4af37; font-size:1.2rem; }

    /* Table */
    .table-card { background:#141414; border:1px solid #222; border-radius:12px; padding:20px; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:0.85rem; }
    th { padding:14px; border-bottom:1px solid #222; color:#888; font-weight:500; text-transform:uppercase; font-size:0.75rem; letter-spacing:1px; }
    td { padding:14px; border-bottom:1px solid #1a1a1a; color:#ddd; vertical-align:middle; }
    tr:hover { background:#191919; }

    /* Form Styles */
    .form-card { background:#141414; border:1px solid #222; border-radius:12px; padding:25px; max-width:600px; margin-bottom:30px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:0.8rem; color:#aaa; margin-bottom:6px; }
    .form-group input, .form-group textarea { width:100%; background:#0a0a0a; border:1px solid #333; color:#fff; padding:12px; border-radius:6px; font-size:0.9rem; outline:none; }
    .form-group input:focus, .form-group textarea:focus { border-color:#d4af37; }
    .gold-btn { background:#d4af37; color:#000; font-weight:600; border:none; padding:12px 24px; border-radius:6px; cursor:pointer; transition:0.3s; }
    .gold-btn:hover { background:#b5932d; }
    .del-btn { background:#c23934; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-size:0.75rem; cursor:pointer; }

    /* Product Grid */
    .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px; }
    .p-item { background:#141414; border:1px solid #222; border-radius:10px; overflow:hidden; }
    .p-item img { width:100%; height:140px; object-fit:cover; }
    .p-info { padding:12px; }
    .p-title { font-size:0.9rem; font-weight:600; color:#fff; margin-bottom:4px; }
    .p-price { color:#d4af37; font-weight:600; font-size:0.95rem; margin-bottom:8px; }

    @media(max-width:768px) {
      .admin-container { flex-direction:column; }
      .sidebar { width:100%; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid #222; }
      .nav-btn { white-space:nowrap; }
      .main-content { padding:15px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">AMBRAAS PROFESSIONAL</div>
    <div class="status-badge">✦ EXECUTIVE SUITE</div>
  </header>

  <div class="admin-container">
    <div class="sidebar">
      <button class="nav-btn active" onclick="switchTab('analytics')">📊 Analytics & Revenue</button>
      <button class="nav-btn" onclick="switchTab('orders')">📦 Recent Orders</button>
      <button class="nav-btn" onclick="switchTab('products')">✨ Manage Products</button>
    </div>

    <div class="main-content">
      
      <!-- Tab 1: Analytics & Revenue -->
      <div id="tab-analytics" class="tab-content active">
        <div class="grid-stats">
          <div class="stat-card">
            <div class="stat-title">Monthly Revenue</div>
            <div class="stat-val"><span>₹</span><span id="monthlyRevenue">0</span></div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Total Orders</div>
            <div class="stat-val" id="totalOrdersCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Live Catalog Items</div>
            <div class="stat-val" id="totalProductsCount">0</div>
          </div>
        </div>
      </div>

      <!-- Tab 2: Orders -->
      <div id="tab-orders" class="tab-content">
        <h2 style="font-family:'Cinzel',serif; color:#d4af37; margin-bottom:20px; font-size:1.3rem;">Recent Customer Orders</h2>
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="7" style="text-align:center;">No orders yet</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tab 3: Products -->
      <div id="tab-products" class="tab-content">
        <h2 style="font-family:'Cinzel',serif; color:#d4af37; margin-bottom:20px; font-size:1.3rem;">Add New Product</h2>
        <div class="form-card">
          <form id="addProductForm">
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" id="pName" placeholder="e.g. Imperial Silk Cream" required>
            </div>
            <div class="form-group">
              <label>Price (₹)</label>
              <input type="number" id="pPrice" placeholder="e.g. 1299" required>
            </div>
            <div class="form-group">
              <label>Image URL</label>
              <input type="url" id="pImg" placeholder="https://..." required>
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="pDesc" rows="3" placeholder="Luxury product highlights..."></textarea>
            </div>
            <button type="submit" class="gold-btn">+ Publish Product</button>
          </form>
        </div>

        <h2 style="font-family:'Cinzel',serif; color:#d4af37; margin:30px 0 20px 0; font-size:1.3rem;">Active Catalog Products</h2>
        <div class="product-grid" id="productsCatalog"></div>
      </div>

    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
    }

    async function loadData() {
      // Fetch Orders
      const resOrders = await fetch('/api/orders');
      const orders = await resOrders.json();
      
      let revenue = 0;
      const tBody = document.getElementById('ordersTableBody');
      tBody.innerHTML = '';
      
      if(orders.length === 0) {
        tBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#666;">No orders placed yet.</td></tr>';
      } else {
        orders.forEach(o => {
          revenue += (Number(o.total) || 0);
          tBody.innerHTML += `
            <tr>
              <td style="color:#d4af37; font-weight:600;">${o.id || 'N/A'}</td>
              <td>${new Date(o.date).toLocaleDateString()}</td>
              <td>${o.customerName || 'Customer'}</td>
              <td>${o.phone || '-'}</td>
              <td style="max-width:200px;">${o.address || '-'}</td>
              <td style="font-weight:600; color:#fff;">₹${o.total || 0}</td>
              <td><span style="background:rgba(212,175,55,0.1); border:1px solid #d4af37; color:#d4af37; padding:4px 8px; border-radius:12px; font-size:0.75rem;">${o.status || 'Pending'}</span></td>
            </tr>
          `;
        });
      }

      document.getElementById('monthlyRevenue').innerText = revenue.toLocaleString();
      document.getElementById('totalOrdersCount').innerText = orders.length;

      // Fetch Products
      const resProducts = await fetch('/api/products');
      const products = await resProducts.json();
      document.getElementById('totalProductsCount').innerText = products.length;

      const pCatalog = document.getElementById('productsCatalog');
      pCatalog.innerHTML = '';
      products.forEach(p => {
        pCatalog.innerHTML += `
          <div class="p-item">
            <img src="${p.image}" alt="${p.name}">
            <div class="p-info">
              <div class="p-title">${p.name}</div>
              <div class="p-price">₹${p.price}</div>
              <button class="del-btn" onclick="deleteProduct(${p.id})">Delete</button>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newP = {
        name: document.getElementById('pName').value,
        price: document.getElementById('pPrice').value,
        image: document.getElementById('pImg').value,
        desc: document.getElementById('pDesc').value
      };
      await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newP)
      });
      document.getElementById('addProductForm').reset();
      loadData();
    });

    async function deleteProduct(id) {
      if(confirm('Are you sure you want to remove this product?')) {
        await fetch('/api/products/' + id, { method: 'DELETE' });
        loadData();
      }
    }

    loadData();
  </script>
</body>
</html>
