<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambraas Professional — Haute Parfumerie</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; }
    body { background:#0a0a0a; color:#e0e0e0; min-height:100vh; }
    
    header { background:#111; border-bottom:1px solid #c5a059; padding:20px; text-align:center; position:sticky; top:0; z-index:10; }
    .brand { font-family:'Cinzel',serif; font-size:1.8rem; color:#d4af37; letter-spacing:3px; font-weight:700; }
    .tagline { font-size:0.75rem; color:#888; letter-spacing:2px; margin-top:4px; text-transform:uppercase; }

    .container { max-width:1100px; margin:40px auto; padding:0 20px; }
    .product-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:30px; }
    .card { background:#141414; border:1px solid #222; border-radius:12px; overflow:hidden; transition:0.3s; display:flex; flex-direction:column; }
    .card:hover { border-color:#d4af37; transform:translateY(-5px); }
    .card img { width:100%; height:260px; object-fit:cover; }
    .card-body { padding:20px; flex:1; display:flex; flex-direction:column; }
    .card-title { font-family:'Cinzel',serif; font-size:1.2rem; color:#fff; margin-bottom:8px; }
    .card-desc { font-size:0.85rem; color:#888; line-height:1.5; margin-bottom:15px; flex:1; }
    .card-footer { display:flex; justify-content:space-between; align-items:center; }
    .card-price { font-size:1.3rem; color:#d4af37; font-weight:600; }
    .btn-buy { background:#d4af37; color:#000; border:none; padding:10px 20px; border-radius:6px; font-weight:600; cursor:pointer; transition:0.3s; }
    .btn-buy:hover { background:#b5932d; }

    /* Modal Checkout */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; padding:20px; }
    .modal.active { display:flex; }
    .modal-box { background:#141414; border:1px solid #d4af37; border-radius:12px; width:100%; max-width:440px; padding:25px; text-align:center; position:relative; }
    .close-btn { position:absolute; top:12px; right:15px; font-size:1.5rem; color:#888; cursor:pointer; }
    .form-group { margin-bottom:12px; text-align:left; }
    .form-group label { display:block; font-size:0.75rem; color:#aaa; margin-bottom:4px; }
    .form-group input { width:100%; background:#0a0a0a; border:1px solid #333; color:#fff; padding:10px; border-radius:6px; outline:none; }
    
    .qr-area { background:#fff; border-radius:8px; padding:12px; display:inline-block; margin:15px 0; }
    .qr-area img { width:180px; height:180px; display:block; }
    .pay-btn { width:100%; background:#d4af37; color:#000; font-weight:600; border:none; padding:12px; border-radius:6px; cursor:pointer; font-size:0.95rem; margin-top:10px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">AMBRAAS PROFESSIONAL</div>
    <div class="tagline">Haute Parfumerie & Luxury Grooming</div>
  </header>

  <div class="container">
    <div class="product-grid" id="catalog"></div>
  </div>

  <!-- Modal Checkout -->
  <div class="modal" id="checkoutModal">
    <div class="modal-box">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 style="font-family:'Cinzel',serif; color:#d4af37; margin-bottom:5px;">Express Checkout</h3>
      <p id="modalItem" style="font-size:0.85rem; color:#aaa; margin-bottom:15px;"></p>
      
      <div id="step-1">
        <div class="form-group"><label>Full Name</label><input type="text" id="custName" placeholder="Ahmad Khan" required></div>
        <div class="form-group"><label>WhatsApp Phone</label><input type="tel" id="custPhone" placeholder="9876543210" required></div>
        <div class="form-group"><label>Delivery Address</label><input type="text" id="custAddr" placeholder="House No, City, Pincode" required></div>
        <button class="pay-btn" onclick="proceedToPay()">Proceed to UPI Payment</button>
      </div>

      <div id="step-2" style="display:none;">
        <p style="font-size:0.85rem; color:#ccc;">Scan via Google Pay, PhonePe, or Paytm</p>
        <div class="qr-area">
          <img id="upiQR" src="" alt="UPI QR">
        </div>
        <div style="font-size:1.1rem; color:#d4af37; font-weight:600; margin-bottom:10px;">Pay: ₹<span id="qrAmount"></span></div>
        <div class="form-group">
          <label>12-Digit UPI Transaction / UTR No.</label>
          <input type="text" id="custUtr" placeholder="Enter Reference / UTR No." required>
        </div>
        <button class="pay-btn" onclick="completeOrder()">Confirm Order</button>
      </div>
    </div>
  </div>

  <script>
    const DUMMY_UPI = "shakir.ambraas@okaxis";
    let activeProduct = null;

    async function loadCatalog() {
      const res = await fetch('/api/products');
      const products = await res.json();
      const container = document.getElementById('catalog');
      container.innerHTML = '';
      products.forEach(p => {
        container.innerHTML += `
          <div class="card">
            <img src="${p.image}" alt="${p.name}">
            <div class="card-body">
              <div class="card-title">${p.name}</div>
              <div class="card-desc">${p.desc || 'Premium formulation curated for distinction.'}</div>
              <div class="card-footer">
                <div class="card-price">₹${p.price}</div>
                <button class="btn-buy" onclick="openCheckout(${p.id}, '${p.name}', ${p.price})">Order Now</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openCheckout(id, name, price) {
      activeProduct = { id, name, price };
      document.getElementById('modalItem').innerText = `${name} — ₹${price}`;
      document.getElementById('step-1').style.display = 'block';
      document.getElementById('step-2').style.display = 'none';
      document.getElementById('checkoutModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('checkoutModal').classList.remove('active');
    }

    function proceedToPay() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const addr = document.getElementById('custAddr').value.trim();
      if (!name || !phone || !addr) return alert('Please enter delivery details.');

      document.getElementById('qrAmount').innerText = activeProduct.price;
      const upiUrl = `upi://pay?pa=${DUMMY_UPI}&pn=Ambraas%20Professional&am=${activeProduct.price}&cu=INR`;
      document.getElementById('upiQR').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiUrl)}`;

      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
    }

    async function completeOrder() {
      const utr = document.getElementById('custUtr').value.trim();
      if (!utr) return alert('Please enter the 12-digit UPI UTR number.');

      const orderData = {
        customerName: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddr').value,
        productName: activeProduct.name,
        total: activeProduct.price,
        utr: utr,
        paymentMode: "UPI QR"
      };

      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });
      const data = await res.json();
      if (data.success) {
        alert('Payment submitted! Your order ID is ' + data.order.id);
        closeModal();
      }
    }

    loadCatalog();
  </script>
</body>
</html>
